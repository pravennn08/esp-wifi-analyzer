[package]
name = "analyzer-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "esp-wifi-analyzer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
analyzer-core.workspace = true
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "esp-radio", "esp-alloc", "embassy"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "wifi", "esp-alloc", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
esp-println = { version = "0.18.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
