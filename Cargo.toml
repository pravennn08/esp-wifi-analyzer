[workspace]
members = ["crates/analyzer-core", "firmware"]
default-members = ["crates/analyzer-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
analyzer-core = { path = "crates/analyzer-core" }
heapless = "0.9.2"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
